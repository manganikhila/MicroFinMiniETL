// ETL steps for loan AR (Accounts Receivable) from FBANK
// LOAD: FULL (incremental merge comes later)

spark-properties = {
    "spark.sql.shuffle.partitions" = "4"
}

pipeline {
  name = "dw_collection_ar_loan"
  primary_owner = "MicroFin DWH Team"
  descr = """
    Loan AR data from FBANK: one row per loan, open and closed.
  """,
  steps = [
    LoanMasterDataListStep,
    Src_loan_open_ar,
    Src_loan_close_ar,
    Final_loan_ar
  ]
}

steps {

LoanMasterDataListStep = {
    class-name = spark_loader_step.SparkLoaderStep,
    descr = """
        Clean list of all loans with proper date columns.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = loan_master_data_list,
          sql = """
                select unit,
                       loan_id,
                       member_id,
                       product,
                       to_date(open_date)  as open_date,
                       to_date(close_date) as close_date,
                       loan_amount,
                       outstanding,
                       principal_due,
                       interest_due,
                       coalesce(closed, 0) as closed
                from hm_memberloan
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Src_loan_open_ar = {
    class-name = spark_loader_step.SparkLoaderStep,
    descr = """
        Loans that are still open.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = src_loan_open_ar,
          sql = """
                select *, 'Open' as ar_flag
                from loan_master_data_list
                where closed <> 1
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Src_loan_close_ar = {
    class-name = spark_loader_step.SparkLoaderStep,
    descr = """
        Loans that are closed.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = src_loan_close_ar,
          sql = """
                select *, 'Closed' as ar_flag
                from loan_master_data_list
                where closed = 1
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Final_loan_ar = {
    class-name = spark_loader_step.SparkLoaderStep,
    descr = """
        UNION ALL of open and closed loan AR.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = final_loan_ar,
          sql = """
                select * from src_loan_open_ar
                UNION ALL
                select * from src_loan_close_ar
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
}

}