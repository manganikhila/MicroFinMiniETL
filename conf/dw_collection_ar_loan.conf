include required(file("${CONF_HOME}/microfin_dwh_${env}.conf"))
include required(file("${CONF_HOME}/microfin_dwh_base.conf"))

// ETL steps for loan AR (Accounts Receivable) from FBANK
// LOAD: FULL for now (incremental merge comes in Step 8)

spark-properties = {
    "spark.sql.shuffle.partitions" = "4"
}

pipeline {
  name = "dw_collection_ar_loan"
  primary_owner = "MicroFin DWH Team"
  descr = """
    Loan AR data from FBANK: one row per loan, open and closed.
  """,
  steps = [
    LoanProductRefStep,
    CollectionFollowupLoadStep,
    LoanMasterDataListStep,
    Src_loan_open_ar,
    Src_loan_close_ar,
    Final_loan_ar,
    dummy,
    SurrogateKeyGenerationCompleteness,
    CollectionFollowupStep,
    LoadTargetStep
  ]
}

steps {

LoanProductRefStep = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Loads the product category reference list using Spark's built-in CSV reader.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = loan_product_ref_ddl,
          sql = """
                CREATE OR REPLACE TEMPORARY VIEW loan_product_ref
                USING csv
                OPTIONS (path 'ref/loan_product_category.csv', header 'true', inferSchema 'true')
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

LoanMasterDataListStep = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Clean list of all loans with dates and product category.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = loan_master_data_list,
          sql = """
                select l.unit,
                       l.loan_id,
                       l.member_id,
                       l.product,
                       coalesce(r.product_category, 'Unmapped') as product_category,
                       to_date(l.open_date)  as open_date,
                       to_date(l.close_date) as close_date,
                       l.loan_amount,
                       l.outstanding,
                       l.principal_due,
                       l.interest_due,
                       coalesce(l.closed, 0) as closed
                from hm_memberloan l
                left join loan_product_ref r
                  on l.product = r.product
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Src_loan_open_ar = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Loans that are still open.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = src_loan_open_ar,
          sql = """
                select *, 'Open' as ar_flag
                from loan_master_data_list
                where closed <> 1
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Src_loan_close_ar = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Loans that are closed.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = src_loan_close_ar,
          sql = """
                select *, 'Closed' as ar_flag
                from loan_master_data_list
                where closed = 1
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

Final_loan_ar = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        UNION ALL of open and closed loan AR, saved to a staging table.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          out-table = stg_final_loan_ar,
          table = final_loan_ar,
          sql = """
                select * from src_loan_open_ar
                UNION ALL
                select * from src_loan_close_ar
                """
        }, metadata = {is-input = true, is-save = true}
      }
    }
},

dummy = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Reads the saved staging table back.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = dummy,
          in-table = stg_final_loan_ar
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

SurrogateKeyGenerationCompleteness = {
    class-name = minietl.customsteps.surrogate_key_generator.SurrogateKeyGenerator,
    descr = """
        Adds dw_collection_ar_loan_key, continuing from the target table's highest key.
    """,
    properties = {
      surrogateKeyColumnName = dw_collection_ar_loan_key,
      deltaTableName = dummy,
      tableName = final_loan_ar_sur,
      targetTableName = dw_collection_ar_loan,
      nkConstraints = "unit, loan_id"
    }
},

CollectionFollowupLoadStep = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Loads the collections team's daily follow-up export with Spark's built-in CSV reader.
        Every column is read as text; the next step casts the types.
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          table = collection_followup_raw_ddl,
          sql = """
                CREATE OR REPLACE TEMPORARY VIEW collection_followup_raw
                USING csv
                OPTIONS (path 'input/collections/collection_followups.csv', header 'true')
                """
        }, metadata = {is-input = true, is-save = false}
      }
    }
},

CollectionFollowupStep = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Order 1: clean the rows (types, two date formats, tidy text).
        Order 2: keep only the latest follow-up per loan.
        Order 3: list follow-ups that point at closed or unknown loans.
    """,
    inputs = {
      clean-stage = {
        order = 1, sql = {
          sql-type = local,
          table = collection_followup_clean,
          sql = """
                select trim(unit)                      as unit,
                       cast(loan_id as int)            as loan_id,
                       trim(assigned_officer)          as assigned_officer,
                       initcap(trim(priority))         as followup_priority,
                       case
                         when next_followup_date rlike '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                           then to_date(next_followup_date, 'yyyy-MM-dd')
                         when next_followup_date rlike '^[0-9]{2}-[0-9]{2}-[0-9]{4}$'
                           then to_date(next_followup_date, 'dd-MM-yyyy')
                       end                             as next_followup_date,
                       cast(promised_amount as double) as promised_amount,
                       remarks                         as followup_remarks
                from collection_followup_raw
                where loan_id is not null
                """
        }, metadata = {is-input = true, is-save = false}
      },
      dedupe-stage = {
        order = 2, sql = {
          sql-type = local,
          table = collection_followup_latest,
          sql = """
                select unit, loan_id, assigned_officer, followup_priority,
                       next_followup_date, promised_amount, followup_remarks
                from (
                    select c.*,
                           row_number() over (partition by unit, loan_id
                                              order by next_followup_date desc) as rn
                    from collection_followup_clean c
                ) t
                where rn = 1
                """
        }, metadata = {is-input = true, is-save = false}
      },
      exceptions-stage = {
        order = 3, sql = {
          sql-type = local,
          out-table = stg_collection_followup_exceptions,
          table = collection_followup_exceptions,
          sql = """
                select f.*,
                       case when l.loan_id is null then 'Loan not found'
                            else 'Loan already closed' end as exception_reason
                from collection_followup_latest f
                left join final_loan_ar_sur l
                  on f.unit = l.unit and f.loan_id = l.loan_id
                where l.loan_id is null
                   or l.ar_flag = 'Closed'
                """
        }, metadata = {is-input = true, is-save = true}
      }
    }
},

LoadTargetStep = {
    class-name = minietl.spark_loader_step.SparkLoaderStep,
    descr = """
        Writes the final table, with collection follow-up details for open loans.
        (Step 8 replaces this overwrite with a merge/upsert.)
    """,
    inputs = {
      df-stage = {
        order = 1, sql = {
          sql-type = local,
          out-table = dw_collection_ar_loan,
          table = dw_collection_ar_loan,
          sql = """
                select s.dw_collection_ar_loan_key,
                       s.unit,
                       s.loan_id,
                       s.member_id,
                       s.product,
                       s.product_category,
                       s.open_date,
                       s.close_date,
                       s.loan_amount,
                       s.outstanding,
                       s.principal_due,
                       s.interest_due,
                       s.ar_flag,
                       f.assigned_officer,
                       f.followup_priority,
                       f.next_followup_date,
                       f.promised_amount,
                       current_timestamp() as audit_upd_ts
                from final_loan_ar_sur s
                left join collection_followup_latest f
                  on s.unit = f.unit
                 and s.loan_id = f.loan_id
                 and s.ar_flag = 'Open'
                """
        }, metadata = {is-input = true, is-save = true}
      }
    }
}

}